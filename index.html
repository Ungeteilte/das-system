<style>
:root{--acc:#3ad7ff;--acc2:#7f8cff;--bg:#050a18;--bg2:#0a1630;--txt:#dff6ff;--dim:#7d9bb8;--grad:linear-gradient(90deg,var(--acc),var(--acc2));--bad:#ff4d6d;--ok:#4dffa6;--gold:#ffd55a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at 50% -10%,var(--bg2),var(--bg) 60%) fixed,var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;overscroll-behavior:none;transition:background .6s}
body.gamer{font-family:ui-monospace,"Cascadia Mono",Menlo,monospace}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);z-index:0}
#app{overflow-x:clip;position:relative;z-index:1;max-width:560px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 12px calc(96px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}

header.top .pill{font-size:13px;padding:6px 10px;border:1px solid var(--acc);border-radius:20px;box-shadow:0 0 8px color-mix(in srgb,var(--acc) 50%,transparent);white-space:nowrap}
.win{position:relative;border:1.5px solid var(--acc);border-radius:10px;background:linear-gradient(180deg,color-mix(in srgb,var(--bg2) 85%,transparent),color-mix(in srgb,var(--bg) 92%,transparent));box-shadow:0 0 14px color-mix(in srgb,var(--acc) 45%,transparent),inset 0 0 18px color-mix(in srgb,var(--acc) 15%,transparent);padding:14px;margin:12px 0}
.win.fusionwin{border-image:var(--grad) 1;border-radius:0}
.win h2{margin:-2px 0 10px;font-size:15px;letter-spacing:.18em;text-transform:uppercase;text-align:center;color:var(--acc);text-shadow:0 0 10px var(--acc)}
.win h2::before,.win h2::after{content:"◆";font-size:9px;margin:0 8px;vertical-align:middle;opacity:.8}
.win h3{margin:14px 0 8px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc2)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}

.bar.hp>i{background:linear-gradient(90deg,#ff3355,#ff7a59);box-shadow:0 0 8px #ff3355}
.bar.mp>i{background:linear-gradient(90deg,#3a6bff,#3ad7ff)}
.bar.en>i{background:linear-gradient(90deg,#a01030,#ff4d6d)}
button,.btn{font:inherit;color:var(--txt);background:color-mix(in srgb,var(--acc) 14%,#000a);border:1.5px solid var(--acc);border-radius:9px;min-height:46px;padding:10px 14px;font-weight:700;letter-spacing:.04em;cursor:pointer;box-shadow:0 0 8px color-mix(in srgb,var(--acc) 35%,transparent);touch-action:manipulation;transition:transform .08s,background .2s}

button.full{width:100%}
a.btn{text-decoration:none;box-sizing:border-box;width:100%}a.btn.prim{background:var(--grad);color:#021;border:none;text-shadow:none}

#upd.on{display:flex}

.rank{display:inline-grid;place-items:center;width:46px;height:46px;border:2px solid var(--acc);border-radius:8px;font-size:26px;font-weight:900;color:var(--acc);text-shadow:0 0 12px var(--acc);box-shadow:0 0 12px var(--acc) inset}
.big{font-size:30px;font-weight:900;letter-spacing:.05em}

.okc{color:var(--ok)}.badc{color:var(--bad)}.goldc{color:var(--gold)}
input,select,textarea{font:inherit;color:var(--txt);background:#0008;border:1.5px solid color-mix(in srgb,var(--acc) 60%,transparent);border-radius:8px;padding:11px;min-height:46px;width:100%}

.toast{max-width:520px;width:100%;border:1.5px solid var(--acc);background:color-mix(in srgb,var(--bg) 94%,transparent);border-radius:8px;padding:10px 12px;box-shadow:0 0 16px var(--acc);animation:tin .35s ease-out, tout .4s ease-in forwards;animation-delay:0s,var(--d,3.2s);font-size:14px}
.toast b{color:var(--acc);letter-spacing:.08em}
@keyframes tin{from{transform:translateY(-30px) scaleY(.2);opacity:0}to{transform:none;opacity:1}}
@keyframes tout{to{transform:translateY(-20px);opacity:0}}
#modal{position:fixed;inset:0;z-index:50;background:#000b;display:none;align-items:center;justify-content:center;padding:14px}
#modal.on{display:flex}
#modal .win{width:100%;max-width:520px;max-height:88vh;overflow:auto;animation:pop .3s ease-out}
@keyframes pop{from{transform:scaleY(.05);opacity:0}60%{transform:scaleY(1.04)}to{transform:none;opacity:1}}
#fx{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 25%,#000d),#000e 70%);text-align:center;padding:20px}
#fx.on{display:flex}
.lvlup{font-size:46px;font-weight:900;letter-spacing:.12em;color:#fff;text-shadow:0 0 12px var(--acc),0 0 30px var(--acc),0 0 60px var(--acc);animation:lv 1.2s ease-out}
@keyframes lv{0%{transform:scale(3);opacity:0;filter:blur(8px)}50%{transform:scale(.9);opacity:1;filter:none}100%{transform:scale(1)}}
.ring{width:220px;height:220px;border-radius:50%;border:3px solid var(--acc);box-shadow:0 0 30px var(--acc),inset 0 0 30px var(--acc);position:absolute;animation:ring 1.4s ease-out forwards;pointer-events:none}
@keyframes ring{from{transform:scale(.1);opacity:1}to{transform:scale(3);opacity:0}}
.arise{font-size:52px;font-weight:900;color:#c9a6ff;text-shadow:0 0 14px #7a3cff,0 0 40px #7a3cff;letter-spacing:.1em;animation:lv 1s ease-out}
.shadowrise{font-size:90px;filter:drop-shadow(0 0 18px #7a3cff) brightness(.35) sepia(1) hue-rotate(220deg) saturate(4);animation:rise 1.6s ease-out}
@keyframes rise{from{transform:translateY(120px) scaleY(.2);opacity:0}to{transform:none;opacity:1}}
.smoke{position:absolute;bottom:0;left:0;right:0;height:50%;background:radial-gradient(ellipse at 50% 100%,#5a1fd0aa,transparent 70%);animation:smoke 2s ease-in-out infinite alternate;pointer-events:none}
@keyframes smoke{from{opacity:.5;transform:scaleX(.9)}to{opacity:1;transform:scaleX(1.15)}}
.orbit{position:relative;width:240px;height:240px}
.orbit .o{position:absolute;left:50%;top:50%;font-size:44px;margin:-28px;width:56px;height:56px;display:grid;place-items:center;animation:orb 2.2s cubic-bezier(.6,0,.4,1) forwards}
@keyframes orb{0%{transform:rotate(var(--a)) translateX(110px) rotate(calc(-1*var(--a)));opacity:1}80%{transform:rotate(calc(var(--a) + 720deg)) translateX(0) rotate(calc(-1*var(--a) - 720deg));opacity:1}100%{transform:scale(0);opacity:0}}
.flash{position:fixed;inset:0;background:#fff;animation:flash .9s ease-out forwards;pointer-events:none}
@keyframes flash{from{opacity:.95}to{opacity:0}}
.fusname{font-size:34px;font-weight:900;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;animation:lv 1.1s ease-out;filter:drop-shadow(0 0 12px var(--acc))}
.syscard{border:1.5px solid var(--c,var(--acc));border-radius:10px;padding:12px;margin:10px 0;background:linear-gradient(135deg,color-mix(in srgb,var(--c,var(--acc)) 14%,#0008),#0006);box-shadow:0 0 10px color-mix(in srgb,var(--c,var(--acc)) 35%,transparent)}
.syscard.locked{filter:grayscale(.85) brightness(.75);border-style:dashed}
.syscard .si{font-size:34px;width:48px;text-align:center}
.enemy{font-size:84px;text-align:center;line-height:1.1;filter:drop-shadow(0 0 14px #ff335588);transition:transform .15s}
.enemy.hit{animation:hit .3s}
@keyframes hit{0%,100%{transform:none}25%{transform:translateX(-10px) rotate(-6deg);filter:brightness(3)}75%{transform:translateX(8px)}}
.dmg{position:absolute;font-weight:900;font-size:28px;color:#fff;text-shadow:0 0 8px var(--bad);animation:dmg .9s ease-out forwards;pointer-events:none;left:50%;top:30%}
@keyframes dmg{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-60px);opacity:0}}
.log{max-height:130px;overflow:auto;font-size:13px;color:var(--dim);background:#0006;border-radius:8px;padding:8px;margin-top:8px}
.log div{padding:2px 0}
.cal{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.cal i{aspect-ratio:1;border-radius:4px;background:#ffffff12;border:1px solid #ffffff20}
.cal i.y{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.cal i.n{background:#ff4d6d66}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--c,var(--acc));border-radius:20px;padding:8px 12px;margin:4px;min-height:42px;cursor:pointer;background:#0006}
.chip.on{background:color-mix(in srgb,var(--c,var(--acc)) 35%,#000a);box-shadow:0 0 10px var(--c,var(--acc))}
.penalty{border-color:var(--bad)!important;box-shadow:0 0 16px #ff4d6d88,inset 0 0 18px #ff4d6d33!important}
.penalty h2{color:var(--bad)!important;text-shadow:0 0 10px var(--bad)!important}
.fadein{animation:fi .25s ease-out}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
hr{border:none;border-top:1px dashed color-mix(in srgb,var(--acc) 35%,transparent);margin:12px 0}
.item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed #ffffff18}
.item .ii{font-size:26px;width:36px;text-align:center}
/* Nachweis-System */
#proof{position:fixed;inset:0;z-index:45;display:none;background:radial-gradient(ellipse at 50% 0%,#0a1630,#050a18 70%);overflow:auto;padding:calc(10px + env(safe-area-inset-top)) 12px calc(16px + env(safe-area-inset-bottom))}
#proof.on{display:block}
#proof .pwin{max-width:560px;margin:0 auto;border:1.5px solid var(--acc);border-radius:10px;padding:14px;background:#0a1630cc;box-shadow:0 0 18px color-mix(in srgb,var(--acc) 45%,transparent);animation:pop .3s ease-out}
.phead{text-align:center;margin-bottom:10px}.phead .pq{font-size:22px;font-weight:900;letter-spacing:.06em;color:#fff;text-shadow:0 0 12px var(--acc)}
.pinfo{border:1px dashed color-mix(in srgb,var(--acc) 50%,transparent);border-radius:8px;padding:10px;margin:8px 0;font-size:14px;line-height:1.45;background:#0005}
.stage{position:relative;border:1.5px solid var(--acc);border-radius:10px;overflow:hidden;background:#000;box-shadow:0 0 14px var(--acc)}
.stage video,.stage img{display:block;width:100%;max-height:62vh;object-fit:contain}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
.mirror{transform:scaleX(-1)}
.repbox{position:absolute;top:8px;right:10px;text-align:right;text-shadow:0 0 10px #000,0 0 4px #000}

.pstat2{text-align:center;font-weight:800;margin:6px 0;letter-spacing:.04em}
.gpsbig{text-align:center;margin:6px 0}.gpsbig b{font-size:64px;font-weight:900;color:#fff;text-shadow:0 0 16px var(--acc);font-variant-numeric:tabular-nums}.gpsbig span{margin-left:6px;color:var(--acc);font-weight:800}
.gpsst b{font-size:22px;font-variant-numeric:tabular-nums}
.gpsmap{width:100%;height:auto;border:1px solid color-mix(in srgb,var(--acc) 50%,transparent);border-radius:8px;background:#0006;margin-top:8px}
.tring{position:relative;width:240px;max-width:80vw;margin:6px auto}.tring svg{width:100%;transform:rotate(-90deg)}
.tring .tbg{fill:none;stroke:#ffffff14;stroke-width:10}.tring .tfg{fill:none;stroke:var(--acc);stroke-width:10;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--acc));transition:stroke-dashoffset .25s linear}

.proofbtn{margin-top:2px;border-style:dashed}
.ptag{color:var(--acc2)}
.lockln{margin-top:6px;text-align:center}
.verif{display:inline-block;margin-left:8px;font-size:12px;font-weight:800;padding:2px 8px;border-radius:10px;color:#021;background:linear-gradient(90deg,#4dffa6,#3ad7ff);box-shadow:0 0 10px #4dffa6}
.quest.verified{box-shadow:0 0 14px #4dffa666,inset 0 0 12px #3ad7ff22}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.gi{position:relative;border:1px solid color-mix(in srgb,var(--acc) 50%,transparent);border-radius:6px;overflow:hidden;cursor:pointer;background:#000}
.gi img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}

.gi em{display:block;font-style:normal;font-size:10px;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim)}

<div id="toasts"></div>
<div id="app"><header class="top"><div class="sysname" id="hdrName">System</div><div class="pill" id="hdrPill"></div></header><main id="main"></main></div>

<script>
'use strict';
/* =====================================================================
   DAS SYSTEM – Real-Life Leveling (v1)
   Datengetrieben: neue Systeme einfach in SYSTEMS + MECH ergänzen.
   ===================================================================== */
const SAVE_KEY = 'das-system-save-v1';
const STATS = {str:{n:'Stärke',i:'💪'},vit:{n:'Ausdauer',i:'❤️'},agi:{n:'Beweglichkeit',i:'⚡'},int:{n:'Intelligenz',i:'🧠'},per:{n:'Wahrnehmung',i:'👁️'}};
const RANKS = [{r:'E',l:1},{r:'D',l:10},{r:'C',l:20},{r:'B',l:35},{r:'A',l:50},{r:'S',l:70}];
const POINTS_PER_LEVEL = 3;
const xpNeed = l => Math.round(80 * Math.pow(l, 1.35));

/* ---------- Freischalt-Bedingungen ---------- */
const COND = {
  level:   {n:v=>`Level ${v} erreichen`, val:()=>S.level},
  streak:  {n:v=>`${v}-Tage-Streak`, val:()=>Math.max(curStreak(), S.bestStreak)},
  dungeons:{n:v=>`${v} Gates abschließen`, val:()=>S.cnt.dungeons},
  side:    {n:v=>`${v} Nebenquests erledigen`, val:()=>S.cnt.side},
  quests:  {n:v=>`${v} Quests insgesamt erledigen`, val:()=>S.cnt.quests},
  shadows: {n:v=>`${v} Schatten erwecken`, val:()=>S.cnt.arise},
  systems: {n:v=>`${v} Systeme freischalten`, val:()=>S.sys.unlocked.length},
  allDone: {n:v=>`${v}× alle Daily Quests geschafft`, val:()=>S.cnt.allDone},
};
const condMet = c => c.every(x => COND[x.k].val() >= x.v);

/* ---------- SYSTEME (datengetrieben) ----------
   id, name, icon, tag (Popup-Präfix), theme {acc,acc2,bg,bg2}, unlock [{k,v}], res (Ressource),
   quests (Standard-System-Quests), flavor, mech (Mechanik-Schlüssel in MECH)                      */
const SYSTEMS = [
 {id:'solo', name:'System des Erwachten', icon:'💠', tag:'[SYSTEM]', theme:{acc:'#3ad7ff',acc2:'#7f8cff',bg:'#050a18',bg2:'#0a1a3a'},
  desc:'Das Startsystem. Tägliche Pflicht-Quests, Strafquests, Gates und eine Armee aus Schatten.',
  unlock:[], res:{n:'Gate-Schlüssel',i:'🗝️',key:'keys'}, mech:'shadows',
  flavor:{unlock:'Du wurdest als Spieler ausgewählt.',all:'Belohnung für das Abschließen der Daily Quest erhalten.'},
  quests:[
   {name:'Liegestütze',target:100,unit:'Wdh.',stat:'str',xp:40},
   {name:'Sit-ups',target:100,unit:'Wdh.',stat:'vit',xp:40},
   {name:'Kniebeugen',target:100,unit:'Wdh.',stat:'agi',xp:40},
   {name:'Laufen',target:10,unit:'km',stat:'vit',xp:60}]},
 {id:'ninja', name:'Chakra-System', icon:'🌀', tag:'[CHAKRA]', theme:{acc:'#ff8a2a',acc2:'#ffcf3a',bg:'#120804',bg2:'#2a1206'},
  desc:'Pfad des Schattenkriegers. Sammle Chakra durch Training und schalte Jutsu-Techniken frei.',
  unlock:[{k:'level',v:5}], res:{n:'Chakra',i:'🌀'}, mech:'jutsu',
  flavor:{unlock:'Dein Chakra ist erwacht. Die Ninja-Akademie öffnet ihre Tore.',all:'Chakra-Fluss gemeistert!'},
  quests:[
   {name:'Klimmzüge',target:20,unit:'Wdh.',stat:'str',xp:25,res:15},

function merge(def, s){ // fehlende Felder aus Defaults ergänzen (Migration)
  if (Array.isArray(def) || typeof def!=='object' || def===null) return s===undefined?def:s;
  const o = {...def};
  if (s && typeof s==='object') for (const k in s) o[k] = (k in def) ? merge(def[k], s[k]) : s[k];
  return o;
}
let S;
function load(){
  try { const raw = localStorage.getItem(SAVE_KEY); S = raw ? merge(newState(), JSON.parse(raw)) : newState(); }
  catch(e){ console.warn('Speicherstand defekt, neu gestartet', e); S = newState(); }
  migrateProof(S);
}
function save(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch(e){ toast('Speichern fehlgeschlagen: '+e.message,'[FEHLER]'); } }

/* =================== Boni / abgeleitete Werte =================== */
function addB(t, b, mult=1){ for (const k in b) t[k] = (t[k]||0) + b[k]*mult; }
function bonuses(){
  const B = {};
  for (const id of S.sys.unlocked){ const m = MECH[SYS[id].mech]; if (m && m.bonus) addB(B, m.bonus()); }
  for (const s of Object.values(S.equip)) if (s && SHOPI[s]) addB(B, SHOPI[s].b);
  for (const id of S.owned) if (SHOPI[id]?.type==='perm') addB(B, SHOPI[id].b);
  if (S.buffs.xpUntil > Date.now()) B.xp = (B.xp||0) + 50;
  const f = activeFusion(); if (f && S.owned.includes('f_cat')) B.xp = (B.xp||0) + 5*f.src.length;
  if (f){ B.xp = (B.xp||0) + FUSION_XP_PER_SYS*f.src.length; B.res = (B.res||0) + FUSION_RES_PER_SYS*f.src.length; }
  return B;
}
function stat(k, B=bonuses()){ return S.base[k] + (B[k]||0) + (B.all||0); }
function derived(){
  const B = bonuses(), st = {}; for (const k in STATS) st[k] = stat(k,B);
  return {B, st,
    hp: Math.round((100 + st.vit*10) * (1+(B.hp||0)/100)),
    mp: Math.round((30 + st.int*3) * (1+(B.mp||0)/100)),
    atk: (5 + st.str*1.5) * (1+(B.dmg||0)/100),
    skill: (10 + st.int*2.6) * (1+(B.dmg||0)/100),
    crit: Math.min(60, st.per*0.4 + (B.crit||0)),
    dodge: Math.min(45, st.agi*0.35 + (B.dodge||0)),
    def: st.vit*0.4,
    power: Object.values(st).reduce((a,b)=>a+b,0)};
}
const rankOf = l => RANKS.filter(r=>l>=r.l).pop().r;

/* =================== Systeme / Fusion Hilfen =================== */
function activeFusion(){ return S.sys.main.startsWith('f:') ? S.sys.fusions.find(f=>'f:'+f.id===S.sys.main) : null; }
function activeIds(){ const f = activeFusion(); return [...new Set([...S.sys.active, ...(f?f.src:[])])].filter(id=>S.sys.unlocked.includes(id)); }
function mainTag(){ const f = activeFusion(); return f ? `[${f.name.toUpperCase()}]` : SYS[S.sys.main]?.tag || '[SYSTEM]'; }
function res(id){ return id==='solo' ? S.keys : (S.sys.res[id]||0); }
function addRes(id, n){
  const amt = Math.round(n * (1 + (bonuses().res||0)/100));
  if (id==='solo') S.keys += n; else S.sys.res[id] = (S.sys.res[id]||0) + amt;
  return id==='solo'?n:amt;
}
function themeOf(ids){
  const t = ids.map(id=>SYS[id].theme);
  return {acc:t[0].acc, acc2:t[t.length-1].acc === t[0].acc ? t[0].acc2 : t[t.length-1].acc, bg:t[0].bg, bg2:t[Math.min(1,t.length-1)].bg2,
    grad:`linear-gradient(90deg,${t.map(x=>x.acc).join(',')})`};
}
function applyTheme(){
  const f = activeFusion();
  const th = f ? themeOf(f.src) : {...SYS[S.sys.main].theme, grad:null};
  if (S.cosTheme && SHOPI[S.cosTheme]){ const c = SHOPI[S.cosTheme].theme; th.acc = c.acc; th.acc2 = c.acc2; th.grad = `linear-gradient(90deg,${c.acc},${c.acc2})`; }
  const r = document.documentElement.style;
  r.setProperty('--acc',th.acc); r.setProperty('--acc2',th.acc2); r.setProperty('--bg',th.bg); r.setProperty('--bg2',th.bg2);
  r.setProperty('--grad', th.grad || `linear-gradient(90deg,${th.acc},${th.acc2})`);
  document.body.classList.toggle('gamer', !f && S.sys.main==='gamer');
  document.querySelector('meta[name=theme-color]').setAttribute('content', th.bg);
}

/* =================== XP / Level =================== */
function gainXP(base, why){
  const B = bonuses(); const amt = Math.max(0, Math.round(base * (1+(B.xp||0)/100)));
  S.xp += amt; S.todayXP += amt;
  const before = S.level, rankBefore = rankOf(S.level);
  while (S.xp >= xpNeed(S.level)){ S.xp -= xpNeed(S.level); S.level++; S.points += POINTS_PER_LEVEL; }
  if (S.level > before){
    log(`Level-Up! ${before} → ${S.level}`);
    const rk = rankOf(S.level);
    queueFx(()=>fxLevelUp(S.level, (S.level-before)*POINTS_PER_LEVEL, rk!==rankBefore?rk:null));
  }
  return amt;
}
function curStreak(){ return S.streak + (soloAllDone() ? 1 : 0); }
function soloQuests(){ return S.quests.filter(q=>q.sys==='solo'); }
function soloAllDone(){ const q = soloQuests(); return q.length>0 && q.every(x=>x.done); }

function checkUnlocks(){
  for (const s of SYSTEMS){
    if (!S.sys.unlocked.includes(s.id) && condMet(s.unlock)){
      S.sys.unlocked.push(s.id); S.sys.active.push(s.id);
      s.quests.forEach(q=>S.quests.push(mkQuest(q,s.id)));
      log(`Neues System freigeschaltet: ${s.name}`);
      queueFx(()=>fxUnlock(s));
    }
  }
  if (!S.sys.fusionUnlocked && condMet(FUSION_UNLOCK)){
    S.sys.fusionUnlocked = true; log('Verschmelzung freigeschaltet');
    queueFx(()=>fxGeneric('🔀','VERSCHMELZUNG ENTSPERRT','Du kannst nun Systeme zu einem eigenen Fusions-System verschmelzen. (Systeme → Verschmelzung)'));
  }
  for (const t of TITLES){
    if (!S.titles.includes(t.n) && condMet(t.c)){ S.titles.push(t.n); log(`Titel erhalten: ${t.n}`); toast(`Titel erhalten: <b>„${esc(t.n)}“</b>`); }
  }
}

/* =================== Tageswechsel / Strafquest =================== */
function rollover(){
  const today = dayStr();
  if (S.day === today) return false;
  const gap = daysBetween(S.day, today);
  if (gap < 0){ S.day = today; return false; } // Uhr zurückgestellt – nichts bestrafen
  const all = soloAllDone(), sq = soloQuests();
  S.history.unshift({d:S.day, done:sq.filter(q=>q.done).length, total:sq.length, all, xp:S.todayXP});
  for (let i=1;i<gap;i++){ const d = new Date(parseDay(S.day)); d.setDate(d.getDate()+i); S.history.unshift({d:dayStr(d),done:0,total:sq.length,all:false,xp:0}); }
  S.history.length = Math.min(S.history.length, 400);
  const missed = !all || gap>1;
  let shielded = false;
  if (missed && (S.inv.shield||0) > 0){ S.inv.shield--; S.shieldUsed = true; shielded = true; log('Streak-Schutz verbraucht'); }
  else S.streak = (all && gap===1) ? S.streak+1 : 0;
  S.bestStreak = Math.max(S.bestStreak, S.streak);
  // offene Strafquest vom Vortag → Strafe
  if (S.penalty && !S.penalty.done){
    const loss = Math.round(xpNeed(S.level)*0.3); S.xp = Math.max(0, S.xp-loss);
    log(`Strafquest nicht erfüllt: −${loss} XP`);
    S.penaltyLoss = loss;
  }
  S.penalty = null;
  if (missed && !shielded){
    const p = pick(PENALTIES);
    S.penalty = penProofFields({...p, progress:0, done:false, from:S.day}); S.penaltySeen = false;
    log(`Strafquest aktiviert: ${p.name}`);
  }
  S.quests.forEach(q=>{q.progress=0;q.done=false;q.verified=false;q.manual=false;q.vprog=0;});
  S.side.forEach(q=>{ if (q.repeat==='daily') q.done=false; });
  S.allBonus = {}; S.todayXP = 0; S.day = today;
  return true;
}

   ${bonusSummary(d.B)}

function bonusSummary(B){
  const parts = [['xp','% XP'],['dmg','% Schaden'],['hp','% HP'],['mp','% MP'],['crit','% Krit'],['dodge','% Ausweichen'],['res','% Ressourcen']].filter(([k])=>B[k]).map(([k,n])=>`+${Math.round(B[k])}${n}`);
  if (S.buffs.xpUntil>Date.now()) parts.push(`🍶 XP-Trank aktiv (${fmtDur(S.buffs.xpUntil-Date.now())})`);
  return parts.length ? `<p class="dim small c" style="margin-top:10px">Boni: ${parts.join(' · ')}</p>` : '';
}

function questCard(q){
  const pct = Math.min(100, q.progress/q.target*100), big = q.target>=50, st = q.stat?STATS[q.stat]:null;
  const need = proofNeeded(q), lock = proofLocked(q), pf = PROOF[q.proof]||PROOF.none;
  const proofLbl = {photo: pairNeeded(q) ? (q.pStart&&q.pStart.day===S.day ? '📸 3/3 Nachher-Foto aufnehmen' : '🔁 Vorher-Foto · Timer · Nachher') : '📸 Beweisfoto aufnehmen', counter:`🎥 Kamera-Zähler · ${EXER[q.ex]?.n||''}`, gps:'🛰️ GPS-Lauf starten', timer:'⏱️ Timer starten'}[q.proof];
  return `<div class="quest ${q.done?'done':''} ${q.done&&q.verified?'verified':''}">
   <div class="row"><div class="sp"><span class="qn">${esc(q.name)}</span>${st?`<span class="tag">${st.i} ${st.n}</span>`:''}${need?`<span class="tag ptag" title="Nachweis: ${pf.n}">${pf.i} ${pf.s}${q.honor?' · 🤝':''}</span>`:''}</div>
     ${UI.edit?`<button data-a="editQuest" data-id="${q.id}">✏️</button>`:`<span class="qp ${q.done?'okc':''}" ${lock?'':`data-a="setProg" data-id="${q.id}"`}>${fmtQ(q.progress)} / ${fmtQ(q.target)} ${esc(q.unit)}</span>`}</div>
   <div class="bar" style="margin:8px 0"><i style="width:${pct}%"></i></div>
   ${q.done?`<div class="row"><span class="okc">✔ ERLEDIGT</span>${q.verified?'<span class="verif">✔ Verifiziert</span>':''}<span class="sp"></span><span class="dim small">+${q.verified?verifiedXP(q):q.xp} XP${q.res?` · +${q.res} ${resIcon(q.sys)}`:''}</span></div>`:
   `<button class="full ghost exbtn" data-a="showEx" data-id="${q.id}">📖 Beispiel ansehen</button>${need?`<button class="full proofbtn" data-a="proofStart" data-id="${q.id}">${proofLbl}</button>`:''}
   ${lock?`<div class="dim small lockln">🔒 Manuelle Eingabe gesperrt – Nachweis erforderlich</div>`:
   `<div class="row" ${need?'style="margin-top:6px"':''}><button class="sq" data-a="prog" data-id="${q.id}" data-d="${big?-10:-1}">−</button><button class="sp" data-a="prog" data-id="${q.id}" data-d="1">+1</button>${big?`<button class="sp" data-a="prog" data-id="${q.id}" data-d="10">+10</button>`:''}<button class="sp ${need?'':'prim'}" data-a="prog" data-id="${q.id}" data-d="all">✓</button></div>`}
   <div class="dim small" style="margin-top:4px">Belohnung: ${q.xp} XP${q.res?` · ${q.res} ${resIcon(q.sys)}`:''}${need&&!q.honor?` · <span class="okc">verifiziert ${verifiedXP(q)} XP</span>`:''}${need&&q.honor?' · 🤝 Ehrenmodus (ohne Bonus)':''}</div>`}
  </div>`;
}
const resIcon = id => SYS[id].res.i;
function vQuests(){
  let h = '';
  if (S.penalty && !S.penalty.done){
    const p = S.penalty;
    h += `<section class="win penalty"><h2>Strafquest</h2><p class="c dim">Die Daily Quest wurde nicht abgeschlossen. Bis Mitternacht erfüllen – sonst verlierst du XP. Gates sind gesperrt.</p>
    <div class="quest"><div class="row"><span class="qn sp">${esc(p.name)}</span><span class="qp">${fmtQ(p.progress)} / ${fmtQ(p.target)} ${esc(p.unit)}</span></div><div class="bar en" style="margin:8px 0"><i style="width:${p.progress/p.target*100}%"></i></div>
    ${penProofUI(p)}</div>
    ${(S.inv.skip||0)?'<button class="full" data-a="useItem" data-id="skip">📜 Strafquest-Erlass einsetzen (halbiert)</button>':''}</section>`;
  }
  const now = new Date(), mid = new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);
  h += `<p class="c dim small">⏳ Reset in <b id="cd">${fmtDur(mid-now)}</b> · Tages-XP: ${fmt(S.todayXP)}</p>
  <div class="row"><button class="sp ${UI.edit?'prim':''}" data-a="toggleEdit">${UI.edit?'✔ Fertig':'✏️ Bearbeiten'}</button><button class="sp" data-a="newQuest">＋ Quest</button></div>`;
  const f = activeFusion(), ids = activeIds();
  const groups = f ? [{title:`🔀 ${f.name}`, key:'f:'+f.id, ids:f.src}] : [];
  ids.filter(id=>!f || !f.src.includes(id)).forEach(id=>groups.push({title:id==='solo'?'Daily Quest: Training zur Stärkung':`${SYS[id].icon} ${SYS[id].name}`, key:id, ids:[id]}));
  // Solo immer zuerst (Pflicht)
  for (const g of groups){
    const qs = S.quests.filter(q=>g.ids.includes(q.sys)); if (!qs.length && !UI.edit) continue;
    const doneN = qs.filter(q=>q.done).length;
    h += `<section class="win ${g.key.startsWith('f:')?'fusionwin':''}"><h2>${esc(g.title)}</h2>
    ${g.ids.includes('solo')?`<p class="c dim small">[Daily Quest eingetroffen] Pflichtquests – alle erledigen für den Bonus. Unvollständig = Strafquest.</p>`:''}
    <p class="c small">${doneN} / ${qs.length} erledigt ${S.allBonus[g.key]?'<span class="okc">· Bonus erhalten ✔</span>':''}</p>
    ${qs.map(questCard).join('')}</section>`;
  }
  const side = S.side.filter(q=>!(q.repeat==='once' && q.done));
  h += `<section class="win"><h2>Nebenquests</h2>
   ${side.map(q=>`<div class="quest ${q.done?'done':''}"><div class="row"><div class="sp"><span class="qn">${esc(q.name)}</span><div class="dim small">${q.xp} XP · ${q.repeat==='daily'?'täglich':'einmalig'}</div></div>
     ${UI.edit?`<button data-a="editSide" data-id="${q.id}">✏️</button>`:`<button class="sq" data-a="showEx" data-id="${q.id}" title="Beispiel">📖</button>`+(q.done?'<span class="okc">✔</span>':`<button class="prim" data-a="sideDone" data-id="${q.id}">Erledigt</button>`)}</div></div>`).join('')||'<p class="dim c">Keine Nebenquests.</p>'}
   <button class="full" data-a="newSide">＋ Nebenquest hinzufügen</button></section>`;
  return h;
}

function afterBattleRender(){

function price(it){ const f = activeFusion() ? 0.9 : 1; const p = {}; for (const k in it.p) p[k] = Math.max(1, Math.round(it.p[k]*(k==='gold'?f:1))); return p; }
const priceTxt = p => Object.entries(p).map(([k,v])=>`${fmt(v)} ${CUR[k].i}`).join(' ');
const canPay = p => Object.entries(p).every(([k,v])=>S[k==='gold'?'gold':'cry']>=v);
const owned = id => S.owned.includes(id);
function shopVisible(it){ if (!it.sys) return true; if (it.sys==='fusion') return S.sys.fusionUnlocked; return S.sys.unlocked.includes(it.sys); }
function vShop(){
  const tabs = `<div class="grid3"><button class="${UI.shopTab==='shop'?'prim':''}" data-a="shopTab" data-id="shop">🛒 Shop</button><button class="${UI.shopTab==='inv'?'prim':''}" data-a="shopTab" data-id="inv">🎒 Inventar</button><button class="${UI.shopTab==='rew'?'prim':''}" data-a="shopTab" data-id="rew">🎁 Belohn.</button></div>`;
  const wallet = `<div class="row c" style="justify-content:space-around;margin:10px 0"><div>🪙 <b>${fmt(S.gold)}</b><div class="dim small">Gold</div></div><div>💎 <b>${fmt(S.cry)}</b><div class="dim small">Kristalle</div></div><div>🗝️ <b>${S.keys}</b><div class="dim small">Schlüssel</div></div></div>`;
  if (UI.shopTab==='inv') return tabs + `<section class="win"><h2>Inventar</h2>${wallet}${vInventory()}</section>`;
  if (UI.shopTab==='rew') return tabs + `<section class="win"><h2>Echte Belohnungen</h2>${wallet}${vRewards()}</section>`;
  const items = SHOP.filter(it=>it.cat===UI.shopCat && shopVisible(it));
  return tabs + `<section class="win"><h2>Händler des Systems</h2>${wallet}
   ${activeFusion()?'<p class="c small okc">🔀 Fusions-Rabatt aktiv: −10 % auf Gold-Preise</p>':''}

   ${items.map(it=>{const p=price(it), once=['equip','perm','cosmetic','title'].includes(it.type), has=once&&owned(it.id), cnt=S.inv[it.id]||0;
     return `<div class="item"><div class="ii">${it.i}</div><div class="sp"><b>${esc(it.n)}</b>${it.sys?` <span class="tag">${it.sys==='fusion'?'🔀 Fusion':SYS[it.sys].icon}</span>`:''}${it.slot?` <span class="tag">${SLOTS[it.slot]}</span>`:''}<div class="dim small">${esc(it.t)}${cnt?` · Besitz: ${cnt}`:''}</div></div>

  </section>`;
}

/* ---------- Systeme & Verschmelzung ---------- */
const FUSE_FRAG = {solo:'Schatten',ninja:'Chakra',gamer:'Pixel',hero:'Helden',cult:'Dao',tower:'Turm',evo:'Chimären',guild:'Gilden'};
function suggestName(ids){ const fr = ids.map(id=>FUSE_FRAG[id]||SYS[id].name.split('-')[0]); const suf = ids.length>=4?'Omni-System':ids.length===3?'Konvergenz':'System'; return (ids.length>3?fr.slice(0,3):fr).join('-')+'-'+suf; }
function vSystems(){
  if (UI.detail) return vSysDetail(SYS[UI.detail]);
  let h = `<section class="win"><h2>Verschmelzung</h2>`;
  if (!S.sys.fusionUnlocked){
    h += `<p class="c" style="font-size:40px">🔒🔀</p><p class="dim c">Endgame: Verschmelze beliebige Systeme zu deinem eigenen Fusions-System.</p>${condList(FUSION_UNLOCK)}`;

/* =================== Quest-Logik =================== */
function dropMats(n){
  if (!S.sys.unlocked.includes('gamer')) return '';
  const B = bonuses(); n += (B.loot||0); const got = {};
  for (let i=0;i<n;i++){ const k = pick(Object.keys(MATS)); S.m.gamer.mats[k]=(S.m.gamer.mats[k]||0)+1; got[k]=(got[k]||0)+1; }
  return Object.entries(got).map(([k,v])=>`${v}×${MATS[k].i}`).join(' ');
}
function completeQuest(q){
  q.done = true; q.progress = q.target;
  q.verified = proofNeeded(q) && !q.manual && (q.vprog||0) > 0;
  const xp = gainXP(q.verified ? verifiedXP(q) : q.xp), gold = Math.round(q.xp/2); S.gold += gold;
  if (q.stat) S.base[q.stat]++;
  let extra = '';
  if (q.sys==='solo'){ S.keys++; extra=' · +1 🗝️'; }
  else if (q.res){ const r = addRes(q.sys,q.res); extra = ` · +${r} ${resIcon(q.sys)}`; }
  if (Math.random() < .5){ const m = dropMats(1); if (m) extra += ' · '+m; }
  S.cnt.quests++; log(`Quest erledigt: ${q.name}`);
  toast(`Quest abgeschlossen: <b>${esc(q.name)}</b>${q.verified?' <span class="verif">✔ Verifiziert</span>':''}<br>+${xp} XP${q.verified?' (inkl. +10 %)':''} · +${gold} 🪙${q.stat?` · +1 ${STATS[q.stat].n}`:''}${extra}`, SYS[q.sys].tag);
  vibrate(40);
  checkAllDone();
}
function checkAllDone(){
  for (const id of activeIds()){
    const qs = S.quests.filter(q=>q.sys===id);
    if (!qs.length || S.allBonus[id] || !qs.every(q=>q.done)) continue;
    S.allBonus[id] = true; const s = SYS[id];
    if (id==='solo'){
      S.cnt.allDone++; S.keys += 2; S.points += 1; S.gold += 60;
      let cryTxt = ''; const st = curStreak(); if (st>0 && st%7===0){ S.cry += 3; cryTxt = `<br>🔥 ${st}-Tage-Streak: +3 💎`; }
      const xp = gainXP(100);
      log('Daily Quest abgeschlossen – Bonus erhalten');
      queueFx(()=>fxGeneric('🏆','DAILY QUEST ABGESCHLOSSEN',`[SYSTEM] ${s.flavor.all}<br>+${xp} XP · +60 🪙 · +2 🗝️ · +1 Statuspunkt${cryTxt}`));
    } else {
      const xp = gainXP(30), r = addRes(id,25); S.gold += 30; const m = id==='gamer'?dropMats(3):'';
      toast(`${esc(s.flavor.all)}<br>Bonus: +${xp} XP · +${r} ${s.res.i} · +30 🪙 ${m}`, s.tag, 4500);
    }
  }
  const f = activeFusion();
  if (f && !S.allBonus['f:'+f.id]){
    const qs = S.quests.filter(q=>f.src.includes(q.sys));
    if (qs.length && qs.every(q=>q.done)){
      S.allBonus['f:'+f.id] = true; const n = f.src.length; const xp = gainXP(40*n); S.gold += 50*n; S.cry += 1;
      queueFx(()=>fxGeneric('🔀','FUSIONS-QUESTS ABGESCHLOSSEN',`${esc(f.name)}: +${xp} XP · +${50*n} 🪙 · +1 💎`));
    }
  }
  checkUnlocks();
}

/* =================== Kampf =================== */
const potionCount = () => (UI.battle?UI.battle.freePot:0) + (S.inv.hp_s||0) + (S.inv.hp_l||0);
function ariseChance(g){ const d = derived(); return Math.max(10, Math.min(90, Math.round(40 + d.st.int*0.8 + d.st.per*0.4 - GATES.indexOf(g)*8))); }
function startBattle(g){
  const d = derived();
  const list = [...g.mobs.map(m=>({n:m[0],i:m[1],hp:m[2],max:m[2],atk:m[3]})), {n:g.boss[0],i:g.boss[1],hp:g.boss[2],max:g.boss[2],atk:g.boss[3],boss:true}];
  UI.battle = {g, list, idx:0, enemy:{...list[0]}, php:d.hp, pmax:d.hp, mp:d.mp, mpmax:d.mp, freePot:1+(d.B.potion||0), log:[`[SYSTEM] Du hast das ${g.rank}-Gate „${g.name}“ betreten.`], over:null, auto:false};
}
function bLog(t){ UI.battle.log.unshift(t); }
function playerAct(kind){
  const b = UI.battle; if (!b || b.over) return;
  const d = derived(), e = b.enemy;
  if (kind==='pot'){
    if (b.freePot>0){ b.freePot--; heal(.4); }
    else if (S.inv.hp_s>0){ S.inv.hp_s--; heal(.4); }
    else if (S.inv.hp_l>0){ S.inv.hp_l--; heal(1); }
    else return;
  } else if (kind==='skill' && b.mp < 15){
    if (!(S.inv.mp_s>0)) return; S.inv.mp_s--; b.mp = Math.min(b.mpmax, b.mp + Math.round(b.mpmax*.6)); bLog('🫙 Manatrank getrunken.');
  } else {
    let dmg = kind==='skill' ? d.skill : d.atk; if (kind==='skill') b.mp -= 15;
    dmg *= rnd(.85,1.15); const crit = Math.random()*100 < d.crit; if (crit) dmg *= 1.8; dmg = Math.round(dmg);
    e.hp -= dmg; b.anim = {hit:true, txt:(crit?'KRIT! ':'')+dmg};
    bLog(`${kind==='skill'?'✨ Mana-Klinge':'⚔️ Angriff'}: ${dmg} Schaden${crit?' (Kritisch!)':''}`);
    if (e.hp <= 0){ bLog(`💥 ${e.n} besiegt!`); return nextEnemy(); }
  }
  // Gegnerzug
  if (Math.random()*100 < d.dodge){ bLog(`💨 Du weichst ${e.n} aus!`); }
  else { const hit = Math.max(1, Math.round(e.atk*rnd(.85,1.2) - d.def)); b.php -= hit; bLog(`🩸 ${e.n} trifft dich: ${hit}`); }
  if (b.php <= 0){ b.over='lose'; stopAuto(); log(`Niederlage im ${b.g.rank}-Gate`); vibrate(300); }
  function heal(p){ const h = Math.round(b.pmax*p); b.php = Math.min(b.pmax, b.php+h); bLog(`🧪 Trank: +${h} HP`); }
}
function nextEnemy(){
  const b = UI.battle; b.idx++;
  if (b.idx < b.list.length){ b.enemy = {...b.list[b.idx]}; bLog(b.enemy.boss?`⚠ Der Boss erscheint: ${b.enemy.n}!`:`Ein ${b.enemy.n} taucht auf.`); return; }
  // Sieg
  stopAuto(); b.over = 'win'; const g = b.g;
  const xp = gainXP(g.xp); const gold = Math.round(g.gold*(1+(bonuses().res||0)/100)); S.gold += gold;
  const cry = 1 + (Math.random() < GATES.indexOf(g)*0.15 ? 1 : 0); S.cry += cry;
  const mats = dropMats(2 + GATES.indexOf(g));
  S.cnt.dungeons++; S.cnt.bosses++;
  b.reward = `+${xp} XP · +${gold} 🪙 · +${cry} 💎${mats?'<br>Materialien: '+mats:''}`;
  b.arise = {tries:3, ok:false};
  log(`${g.rank}-Gate „${g.name}“ abgeschlossen`);
  checkUnlocks();
}
function stopAuto(){ const b = UI.battle; if (b && b.timer){ clearInterval(b.timer); b.timer=null; b.auto=false; } }
function autoStep(){
  const b = UI.battle; if (!b || b.over){ stopAuto(); render(); return; }
  const d = derived();
  if (b.php < b.pmax*.35 && potionCount()) playerAct('pot');
  else if (b.mp >= 15 && d.skill > d.atk) playerAct('skill');
  else playerAct('atk');
  save(); render();
}

  const o={name, target:numv('fTarget',1), unit:val('fUnit').trim()||'×', stat:val('fStat'), xp:Math.min(1000,Math.round(numv('fXP'))), sys:val('fSys'), proof:val('fProof'), ex:val('fEx'), honor:document.getElementById('fHonor').checked};
  if (d.id){ const q=S.quests.find(q=>q.id===d.id); Object.assign(q,o); if(!q.done && q.progress>=q.target) completeQuest(q); }
  else { const q=mkQuest({...o,res:o.sys==='solo'?0:15},o.sys); S.quests.push(q); if(!S.sys.active.includes(o.sys)) S.sys.active.push(o.sys); }
  closeModal(); toast(d.id?'Quest gespeichert.':'Neue Quest hinzugefügt.');
 },
 delQuest(d){ ask('Diese Quest wirklich löschen?', ()=>{ S.quests=S.quests.filter(q=>q.id!==d.id); save(); render(); }, 'Löschen'); },
 prog(d){
  const q=S.quests.find(q=>q.id===d.id); if(!q||q.done) return;
  if (proofLocked(q)){ toast('🔒 Diese Quest erfordert einen Nachweis.','[SYSTEM]'); return; }
  if (proofNeeded(q)) q.manual = true;
  q.progress = d.d==='all' ? q.target : Math.max(0, Math.round((q.progress + Number(d.d))*100)/100);
  if (q.progress >= q.target) completeQuest(q);
 },
 setProg(d){ const q=S.quests.find(q=>q.id===d.id); if(!q||q.done) return; if(proofLocked(q)){ toast('🔒 Diese Quest erfordert einen Nachweis.','[SYSTEM]'); return; }
  modal(`<h2>${esc(q.name)}</h2><label>Fortschritt (${esc(q.unit)})</label><input id="fProg" type="number" inputmode="decimal" min="0" value="${q.progress}"><button class="full prim" style="margin-top:12px" data-a="setProgSave" data-id="${q.id}">Übernehmen</button>`);
  setTimeout(()=>{const i=$('#fProg'); i&&i.select();},50); },
 setProgSave(d){ const q=S.quests.find(q=>q.id===d.id); if(proofLocked(q)) return; if(proofNeeded(q)) q.manual=true; q.progress=numv('fProg'); closeModal(); if(q.progress>=q.target) completeQuest(q); },
 penProg(){ toast('🔒 Strafquests müssen nachgewiesen werden.','[SYSTEM]'); }, // v1.4.0: keine manuelle Eingabe mehr
 sideDone(d){ const q=S.side.find(q=>q.id===d.id); if(!q||q.done) return; q.done=true; const xp=gainXP(q.xp), g=Math.round(q.xp/2); S.gold+=g; S.cnt.side++;
  if (S.sys.unlocked.includes('hero')) addRes('hero',5);
  log(`Nebenquest erledigt: ${q.name}`); toast(`Nebenquest erledigt: <b>${esc(q.name)}</b> · +${xp} XP · +${g} 🪙`); checkUnlocks(); },
 newSide(){ sideForm({name:'',xp:20,repeat:'daily'}, true); },
 editSide(d){ sideForm(S.side.find(q=>q.id===d.id)); },
 saveSide(d){ const name=val('fName').trim(); if(!name){ toast('Bitte einen Namen eingeben.'); return; }
  const o={name, xp:Math.min(500,Math.round(numv('fXP'))), repeat:val('fRep')};
  if (d.id) Object.assign(S.side.find(q=>q.id===d.id),o); else S.side.push({id:uid(),sys:'solo',done:false,...o}); closeModal(); },
 delSide(d){ S.side=S.side.filter(q=>q.id!==d.id); closeModal(); },
 // Gates
 enterGate(d){ const g=GATES.find(x=>x.id===d.id); if(S.keys<1||S.level<g.lvl||(S.penalty&&!S.penalty.done)) return; S.keys--; startBattle(g); toast(`Ein ${g.rank}-Gate hat sich geöffnet.`,'[SYSTEM]'); },
 bAct(d){ playerAct(d.k); },
 bAuto(){ const b=UI.battle; if(!b) return; if(b.auto) stopAuto(); else { b.auto=true; b.timer=setInterval(autoStep, 450); } },
 flee(){ ask('Fliehen? Der Schlüssel ist verloren.', ()=>{ stopAuto(); UI.battle=null; log('Aus einem Gate geflohen'); save(); render(); }, 'Fliehen'); },
 leaveGate(){ stopAuto(); UI.battle=null; },
 arise(){ const b=UI.battle; if(!b||!b.arise||b.arise.ok||b.arise.tries<=0) return; b.arise.tries--;
  if (Math.random()*100 < ariseChance(b.g)){ b.arise.ok=true; const sh=b.g.shadow; S.shadows[sh.id]=Math.min(MAX_SHADOW_LVL,(S.shadows[sh.id]||0)+1); S.cnt.arise++; log(`Schatten erweckt: ${sh.n}`); queueFx(()=>fxArise(sh)); checkUnlocks(); }
  else toast(b.arise.tries?`Erweckung fehlgeschlagen. Noch ${b.arise.tries} Versuch(e).`:'Erweckung fehlgeschlagen. Der Schatten ist verblasst.','[SYSTEM]'); },
 // Shop
 shopTab(d){ UI.shopTab=d.id; }, shopCat(d){ UI.shopCat=d.id; },
 buy(d){ const it=SHOPI[d.id], p=price(it); if(!canPay(p)) return; const once=['equip','perm','cosmetic','title'].includes(it.type); if(once&&owned(it.id)) return;
  S.gold-=p.gold||0; S.cry-=p.cry||0;
  if (it.type==='key') S.keys++;
  else if (it.type==='title'){ S.owned.push(it.id); if(!S.titles.includes(it.title)) S.titles.push(it.title); }
  else if (once){ S.owned.push(it.id); if(it.type==='equip' && !S.equip[it.slot]) S.equip[it.slot]=it.id; }
  else if (it.type==='protect'||it.type==='skip'||it.type==='consumable'){ const k=it.type==='protect'?'shield':it.type==='skip'?'skip':it.id; S.inv[k]=(S.inv[k]||0)+1; }
  log(`Gekauft: ${it.n}`); toast(`Gekauft: <b>${esc(it.n)}</b>`,'[HÄNDLER]'); },
 equip(d){ const it=SHOPI[d.id]; S.equip[it.slot]=it.id; toast(`${esc(it.n)} ausgerüstet.`); },
 unequip(d){ S.equip[d.id]=null; },
 setTheme(d){ S.cosTheme=d.id||null; },
 useItem(d){ const id=d.id; if(!(S.inv[id]>0)) return; let msg='';
  const need = s => { if(!S.sys.unlocked.includes(s)){ toast('Dafür ist das passende System noch gesperrt.'); return false; } return true; };
  switch(id){
   case 'xp_p': S.buffs.xpUntil=Math.max(Date.now(),S.buffs.xpUntil)+2*3600e3; msg='XP-Trank: +50 % XP für 2 Std.'; break;
   case 'skip': { const p=S.penalty; if(!p||p.done){ toast('Keine aktive Strafquest.'); return; } if(p.halved){ toast('Diese Strafquest wurde bereits halbiert.'); return; } p.halved=true; p.target=Math.max(1,Math.ceil(p.target/2)); if(p.progress>=p.target){ S.inv.skip--; penFinish(); return; } msg=`Strafquest halbiert: noch ${p.target} ${p.unit} – Nachweis bleibt Pflicht.`; break; }
   case 's_ess': { const ids=GATES.map(g=>g.shadow.id).filter(s=>S.shadows[s]&&S.shadows[s]<MAX_SHADOW_LVL); if(!ids.length){ toast('Kein Schatten kann gestärkt werden.'); return; } const s=pick(ids); S.shadows[s]++; msg=`${GATES.find(g=>g.shadow.id===s).shadow.n} → Stufe ${S.shadows[s]}`; break; }
   case 'n_pill': if(!need('ninja')) return; S.sys.res.ninja=(S.sys.res.ninja||0)+60; msg='+60 Chakra'; break;
   case 'g_box': if(!need('gamer')) return; msg='Erhalten: '+dropMats(4); break;
   case 'g_book': if(!need('gamer')) return; S.sys.res.gamer=(S.sys.res.gamer||0)+3; msg='+3 Skillpunkte'; break;
   case 'c_pill': if(!need('cult')) return; S.sys.res.cult=(S.sys.res.cult||0)+80; msg='+80 Qi'; break;
   case 'c_elix': if(!need('cult')) return; if(S.elixir){ toast('Ein Elixier wirkt bereits.'); return; } S.elixir=true; msg='Nächster Durchbruch +25 %'; break;
   case 't_comp': if(!need('tower')) return; S.sys.res.tower=(S.sys.res.tower||0)+40; msg='+40 Aufstiegsenergie'; break;
   case 'e_muta': if(!need('evo')) return; S.sys.res.evo=(S.sys.res.evo||0)+60; msg='+60 Evolutionspunkte'; break;
   case 'gu_post': if(!need('guild')) return; if(S.m.guild.members>=10){ toast('Gilde ist voll.'); return; } S.m.guild.members++; msg='Neues Gildenmitglied!'; break;
   default: return;
  }
  S.inv[id]--; log(`Benutzt: ${SHOPI[id].n}`); toast(msg); },
 redeem(d){ const r=S.rewards.find(x=>x.id===d.id); if(!r||S.gold<r.price) return;
  ask(`„${esc(r.n)}“ für ${fmt(r.price)} 🪙 einlösen?`, ()=>{ S.gold-=r.price; S.rewardLog.unshift({t:Date.now(),n:r.n,price:r.price}); S.rewardLog.length=Math.min(S.rewardLog.length,50); log(`Belohnung eingelöst: ${r.n}`);
   save(); render(); queueFx(()=>fxGeneric(r.i||'🎁','BELOHNUNG FREIGEGEBEN',`${esc(r.n)}<br>Du hast es dir verdient. Genieß es!`)); }, 'Einlösen'); },
 newReward(){ rewardForm({n:'',i:'🎁',price:200}, true); },
 editReward(d){ rewardForm(S.rewards.find(r=>r.id===d.id)); },
 saveReward(d){ const n=val('fName').trim(); if(!n){ toast('Bitte einen Namen eingeben.'); return; } const o={n, i:val('fIcon').trim()||'🎁', price:Math.max(1,Math.round(numv('fPrice',1)))};
  if(d.id) Object.assign(S.rewards.find(r=>r.id===d.id),o); else S.rewards.push({id:uid(),...o}); closeModal(); },
 delReward(d){ S.rewards=S.rewards.filter(r=>r.id!==d.id); closeModal(); },
 // Systeme
 sysOpen(d){ UI.detail=d.id; window.scrollTo(0,0); }, sysBack(){ UI.detail=null; },
 sysMain(d){ S.sys.main=d.id; if(!S.sys.active.includes(d.id)) S.sys.active.push(d.id); toast(`Hauptsystem: ${esc(SYS[d.id].name)}`, SYS[d.id].tag); },
 sysToggle(d){ if(d.id==='solo') return; const a=S.sys.active; if(a.includes(d.id)){ S.sys.active=a.filter(x=>x!==d.id); if(S.sys.main===d.id) S.sys.main='solo'; } else a.push(d.id); },
 fuseNew(){ UI.fuseSel=[]; UI.fuseName=null; modal(vFuseNew()); },
 fuseSel(d){ const s=UI.fuseSel; UI.fuseSel = s.includes(d.id)?s.filter(x=>x!==d.id):[...s,d.id]; UI.fuseName=null; modal(vFuseNew()); },
 fuseDo(){ if(UI.fuseSel.length<2) return; const name=(val('fuseName').trim()||suggestName(UI.fuseSel)).slice(0,40);
  const f={id:uid(), name, src:[...UI.fuseSel], created:Date.now()}; S.sys.fusions.push(f); S.sys.main='f:'+f.id; closeModal(); log(`Verschmelzung: ${name}`); queueFx(()=>fxFusion(f)); },
 fuseActivate(d){ const on=S.sys.main==='f:'+d.id; S.sys.main = on?'solo':'f:'+d.id; },
 fuseRename(d){ const f=S.sys.fusions.find(x=>x.id===d.id); modal(`<h2>Umbenennen</h2><input id="fName" value="${esc(f.name)}" maxlength="40"><button class="full prim" style="margin-top:12px" data-a="fuseRenameSave" data-id="${f.id}">Speichern</button>`); },

 quirk(d){ if(S.m.hero.quirk) return; S.m.hero.quirk=d.id; queueFx(()=>fxGeneric(QUIRKS.find(q=>q.id===d.id).i,'GABE ERWACHT',QUIRKS.find(q=>q.id===d.id).n)); },

async function checkUpdate(manual){
  if (!PWA.reg){ if (manual) toast('Update-Prüfung ist nur in der installierten App / online verfügbar.'); return; }

  const now = Date.now(); if (!manual && now - PWA.lastCheck < 60000) return; PWA.lastCheck = now;
  try { await PWA.reg.update(); } catch(e){ if (manual) toast('Update-Server nicht erreichbar.'); return; }
  if (!manual) return;
  if (PWA.reg.waiting && navigator.serviceWorker.controller) showUpdateAvailable(PWA.reg.waiting);
  else if (PWA.reg.installing) toast('Update gefunden – wird geladen …');

function initPWA(){
  // Einmalige Meldung nach einem Update
  const prev = localStorage.getItem(VER_KEY);

  if (prev && cmpVer(APP_VERSION, prev) > 0) setTimeout(()=>showInstalled(prev), 700);

  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); PWA.deferred = e; if (UI.tab==='status'||UI.tab==='more') render(); });
  window.addEventListener('appinstalled', () => { PWA.deferred = null; toast('📲 Installiert! „Das System“ liegt jetzt auf deinem Homescreen.'); render(); });

  if (!('serviceWorker' in navigator) || !location.protocol.startsWith('http')) return; // file:// → ohne SW
  navigator.serviceWorker.register('sw.js').then(reg => {
    PWA.reg = reg;
    if (reg.waiting && navigator.serviceWorker.controller) showUpdateAvailable(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing; if (!w) return;
      w.addEventListener('statechange', () => {
        if (w.state === 'installed' && navigator.serviceWorker.controller) showUpdateAvailable(w);
        if (w.state === 'activated' && UI.tab==='more') render();
      });
    });
    checkUpdate();
  }).catch(e => console.warn('SW', e));
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (PWA.reloading){ PWA.reloading = false; location.reload(); } });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
  window.addEventListener('online', () => checkUpdate());
  setInterval(() => checkUpdate(), 30*60*1000);
}

function guessEx(name){ const n = (name||'').toLowerCase();
  if (/liegest|push|pushup|liegestütz/.test(n)) return 'push';
  if (/kniebeug|squat/.test(n)) return 'squat';
  if (/sit-?up|crunch/.test(n)) return 'situp';
  if (/hampel|jumping.?jack/.test(n)) return 'jack';
  return null; }
function defaultProof(q){ const n = (q.name||'').toLowerCase(), u = (q.unit||'').toLowerCase().trim();
  if (guessEx(n)) return 'counter';
  if (/lauf|jogg|gehen|spazier|wander/.test(n) || u==='km') return 'gps';
  if (/meditat|lernen|studi/.test(n) || /^min/.test(u)) return 'timer';
  return 'photo'; }
function proofDefaults(q){ return {proof: q.proof || defaultProof(q), ex: q.ex || guessEx(q.name) || 'push', honor: !!q.honor, verified:false, manual:false, vprog:0}; }
function migrateProof(st){ // Spielstände < v1.2.0: Nachweis-Felder je Quest ergänzen
  (st.quests||[]).forEach(q => { const d = proofDefaults(q); for (const k in d) if (q[k]===undefined) q[k] = d[k]; });
  if (!st.proofCfg) st.proofCfg = {timerMode:'pause', beep:true, voice:false};
  if ((st.v||1) < 4){ // v1.5.0: Hampelmänner → Kamera-Zähler
    (st.quests||[]).forEach(q => { if (q.proof==='photo' && guessEx(q.name)==='jack'){ q.proof = 'counter'; q.ex = 'jack'; } });
    if (st.penalty && st.penalty.proof==='photo' && /hampel/i.test(st.penalty.name)){ st.penalty.proof = 'counter'; st.penalty.ex = 'jack'; } }
  if (st.penalty) penProofFields(st.penalty, st.day);
  st.v = Math.max(st.v||1, 4);
}

  const p = $('#fProof'), e = $('#fEx'), n = val('fName'), u = val('fUnit');
  if (p && !p.dataset.touched) p.value = defaultProof({name:n, unit:u});
  const g = guessEx(n); if (e && !e.dataset.touched && g) e.value = g; }
const proofNeeded = q => !!q && q.proof && q.proof!=='none';
const isPen = q => !!q && !!q.pen;

function proofCredit(q, amount, why){
  if (!q || q.done || !(amount>0)) return false;
  try { trainCharge(q, amount); } catch(e){}
  q.progress = Math.round((q.progress + amount)*100)/100; q.vprog = Math.round(((q.vprog||0) + amount)*100)/100;
  log(`Nachweis (${PROOF[q.proof]?.n||why}): ${q.name} +${fmtQ(amount)} ${q.unit}`);
  if (q.progress >= q.target){ if (isPen(q)) penFinish(); else completeQuest(q); return true; }
  save(); return false;
}
function unitKind(u){ u = (u||'').toLowerCase().trim();
  if (u==='km') return 'km'; if (u==='m' || u==='meter') return 'm'; if (/schritt/.test(u)) return 'steps';
  if (/^min/.test(u)) return 'min'; if (/^std|^h$/.test(u)) return 'h'; return 'other'; }

/* ---------- Speicher: IndexedDB (Fotos nicht im localStorage) ---------- */
const PDB = {
  db:null,
  open(){ if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => { const r = indexedDB.open('das-system-beweise', 1);
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('meta', {keyPath:'id'}); d.createObjectStore('full', {keyPath:'id'}); };
      r.onsuccess = () => { this.db = r.result; res(this.db); }; r.onerror = () => rej(r.error); }); },
  run(stores, mode, fn){ return this.open().then(db => new Promise((res, rej) => {
    const t = db.transaction(stores, mode); let out; const r = fn(t); if (r) r.onsuccess = () => { out = r.result; };
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); })); },
  add(meta, full){ return this.run(['meta','full'], 'readwrite', t => { t.objectStore('meta').put(meta); t.objectStore('full').put({id:meta.id, img:full}); }); },
  all(){ return this.run(['meta'], 'readonly', t => t.objectStore('meta').getAll()).then(a => (a||[]).sort((x,y)=>y.t-x.t)); },
  full(id){ return this.run(['full'], 'readonly', t => t.objectStore('full').get(id)).then(r => r && r.img); },
  del(ids){ return this.run(['meta','full'], 'readwrite', t => { ids.forEach(id => { t.objectStore('meta').delete(id); t.objectStore('full').delete(id); }); }); },
};

function stampCanvas(src, sw, sh, q, extra, ch){

// In der nativen App (WebView) gibt es window.DasNative: GPS im Hintergrund (Vordergrunddienst), Schrittzähler-Sensor,
// Datei speichern, Spielstand-Umzug. Im Browser / als PWA / auf dem iPhone fehlt die Brücke → alles wie bisher.

function nCall(fn, ...a){ try { const r = NB[fn](...a); return (typeof r === 'string' && /^[\[{]/.test(r)) ? JSON.parse(r) : r; } catch(e){ console.warn('DasNative.'+fn, e); return null; } }

const UMZUG = /[?&]umzug=1/.test(location.search);

const isTWA = () => document.referrer.startsWith('android-app://') || (isAndroid() && isStandalone());

const NEV = {on:{}, wait:[]};
function nOn(type, fn){ (NEV.on[type] = NEV.on[type] || []).push(fn); }
function nWait(type, ms=120000){ return new Promise(res => { const w = {type, res}; NEV.wait.push(w); setTimeout(() => { const i = NEV.wait.indexOf(w); if (i >= 0){ NEV.wait.splice(i, 1); res(null); } }, ms); }); }
window.__dasNative = json => {
  let ev; try { ev = typeof json === 'string' ? JSON.parse(json) : json; } catch(e){ return; } if (!ev || !ev.type) return;
  NEV.wait.filter(w => w.type === ev.type).forEach(w => { NEV.wait.splice(NEV.wait.indexOf(w), 1); w.res(ev); });
  (NEV.on[ev.type] || []).forEach(fn => { try { fn(ev); } catch(e){ console.error(e); } });
};

/* ---------- GPS-Lauf über den nativen Dienst ---------- */
// Der Dienst liefert ROHE Punkte; gefiltert wird weiterhin NUR hier mit gpsFeed (gleiche Anti-Cheat-Regeln überall).
function nGpsInfo(){
  const pm = nCall('perms') || {};
  return `<div class="pinfo okc">📱 <b>Native App:</b> Der Lauf läuft <b>auch bei gesperrtem Handy und im Hintergrund</b> weiter. Du siehst ihn als Benachrichtigung „[SYSTEM] Lauf aktiv“ – dort kannst du ihn auch beenden.</div>
   ${pm.battery===false?`<div class="pinfo small">🔋 Tipp für ${pm.samsung?'Samsung':'dein Handy'}: Schalte die <b>Akku-Optimierung</b> für Das System aus, sonst kann Android lange Läufe abbrechen. <button class="ghost" style="margin-top:6px" data-a="nBattery">🔋 Akku-Optimierung ausschalten</button></div>`:''}
   <div class="pinfo small">Benötigt: <b>Standort</b> („Genau“, „Während der Nutzung der App“), <b>Benachrichtigungen</b> und – für echte Schritte – <b>Körperliche Aktivität</b>.</div>`;
}
function nApplyPoll(s, r, live){
  if (!r || !r.exists) return false;
  if (r.t0) s.t0 = r.t0;
  const wasPaused = s.paused; s.paused = false; // Punkte im Dienst werden nur ohne Pause gespeichert
  for (const p of (r.pts || [])){
    if (p.seg !== s.seg){ s.seg = p.seg; s.last = null; } // nach Pause: neuer Abschnitt, keine Luftlinie über die Pause
    const res = gpsFeed(s, {lat:p.lat, lon:p.lon, acc:p.acc, t:p.t, spd:p.spd==null ? null : p.spd});
    if (live && res === 'vehicle') vibrate([100,50,100]);
  }
  s.paused = wasPaused;
  s.nIdx = r.next != null ? r.next : s.nIdx;
  s.moving = r.moving || 0; s.paused = !!r.paused;
  if (r.steps >= 0){ s.steps = r.steps; s.motionOK = true; } else s.motionPerm = r.stepSensor ? 'denied' : s.motionPerm;
  if (!r.pts || !r.pts.length){ if (!s.status || /Berechtigung|Starte/.test(s.status)) s.status = 'Suche GPS-Signal …'; }
  const b = $('#gPa'); if (b) b.textContent = s.paused ? '▶ Weiter' : '⏸ Pause';
  return true;
}
function nPollLoop(s){
  if (P.iv) clearInterval(P.iv);
  P.iv = setInterval(() => { if (P.sess !== s){ return; } const r = nCall('runPoll', s.nIdx || 0);
    if (!r || !r.exists){ clearInterval(P.iv); P.iv = 0; return; }
    nApplyPoll(s, r, true); gpsDraw();
    if (r.ended && !s.finishing) nGpsFinish(s);
  }, 1000);
}
function nBatteryBox(ev){
  const box = $('#gNat'); if (!box) return;
  const parts = [];
  if (ev && ev.notif === false) parts.push('🔕 Benachrichtigungen sind aus – der Lauf läuft trotzdem, aber ohne Anzeige. <button class="ghost" data-a="nSettings">Einstellungen</button>');
  if (ev && ev.precise === false) parts.push('📍 Nur „ungefährer“ Standort erlaubt – bitte auf <b>„Genau“</b> stellen, sonst werden viele Punkte verworfen. <button class="ghost" data-a="nSettings">Einstellungen</button>');
  if (ev && ev.battery === false) parts.push('🔋 Akku-Optimierung ist an – Samsung &amp; Co. beenden Hintergrund-Apps gern. <button class="ghost" data-a="nBattery">Ausschalten</button>');
  box.innerHTML = parts.map(t => `<div class="pinfo small" style="margin-top:8px">${t}</div>`).join('');
}
async function nGpsStart(s){
  s.native = true; s.nIdx = 0; s.seg = 0; s.wake = null; s.status = 'Berechtigungen werden angefragt …';
  gpsLive(s.q); gpsDraw();
  const meta = JSON.stringify({qid:s.q.id, qname:s.q.name, unit:s.q.unit, started:Date.now(), app:APP_VERSION});
  const pr = nWait('run'); const ok = nCall('startRun', meta);
  if (ok === 'denied'){ s.status = '⚠ Native Funktionen nicht verfügbar'; gpsDraw(); return; }
  const ev = await pr; if (P.sess !== s) return;
  if (!ev || !ev.ok){
    const blocked = ev && ev.blocked;
    ovSet(`${proofHead(s.q,'🛰️ GPS-Lauf')}<div class="pinfo badc">⚠ Ohne <b>Standort-Berechtigung</b> kann Das System keine Strecke messen.${blocked?'<br>Du hast „Nicht mehr fragen“ gewählt – erlaube den Standort in den App-Einstellungen (Berechtigungen → Standort → „Während der Nutzung der App“, „Genauen Standort verwenden“).':''}</div>
      <button class="full prim" data-a="${blocked?'nSettings':'gpsStart'}">${blocked?'⚙️ App-Einstellungen öffnen':'🔄 Nochmal fragen'}</button>${fallbackBtns(s.q)}`);
    return;
  }

}
async function nGpsEnd(s){
  if (s.finishing) return; try { NB.runStop(); } catch(e){}
  await new Promise(r => setTimeout(r, 150));

}
async function nGpsFinish(s){
  if (s.finishing) return; s.finishing = true; if (P.iv){ clearInterval(P.iv); P.iv = 0; }
  const t0 = s.t0;
  if (t0 && S.nRunDone === t0){ try { NB.runClear(); } catch(e){} ovClose(); return; } // schon gutgeschrieben (Absturz-Schutz)
  try { await gpsFinish(s); } finally { S.nRunDone = t0; save(); try { NB.runClear(); } catch(e){} }
}

function nRestoreRun(){
  if (!NATIVE) return false; const cur = P.sess; if (cur && cur.kind === 'gps' && cur.native) return false;
  const r = nCall('runPoll', 0); if (!r || !r.exists) return false;
  let meta = r.meta; try { if (typeof meta === 'string') meta = JSON.parse(meta); } catch(e){ meta = {}; } meta = meta || {};
  const q = findQ(meta.qid);
  if (!q || (r.t0 && S.nRunDone === r.t0)){ if (r.active) try { NB.runStop(); } catch(e){} try { NB.runClear(); } catch(e){}
    if (!q && r.total > 0) toast('Ein Lauf im Hintergrund gehörte zu einer gelöschten Quest und wurde verworfen.', '[SYSTEM]', 4500); return false; }
  if (P.sess) stopAllProof();

    native:true, nStarted:true, nIdx:0, seg:0, wake:null};
  const s = P.sess; $('#proof').className = 'on'; $('#proof').innerHTML = '<div class="pwin"></div>'; gpsLive(q);

  else { try { NB.runEnsure(); } catch(e){} nBatteryBox({notif:(nCall('perms')||{}).notif, battery:(nCall('perms')||{}).battery}); nPollLoop(s); toast('🛰️ Dein Lauf läuft weiter.', '[SYSTEM]'); }

/* ---------- Backup v2 (mit Beweisfotos) ---------- */
const blobToData = b => new Promise((res, rej) => { if (!b) return res(null); const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
async function dataToBlob(d){ if (!d || typeof d !== 'string' || !d.startsWith('data:')) return null; return (await fetch(d)).blob(); }
async function buildBackup(withPhotos=true){
  const o = {type:'das-system-backup', format:2, app:APP_VERSION, created:new Date().toISOString(), save:S, photos:[]};
  if (withPhotos){ try { const all = await PDB.all();
    for (const m of all){ const full = await PDB.full(m.id); o.photos.push({meta:{...m, thumb: await blobToData(m.thumb)}, full: await blobToData(full)}); } }
    catch(e){ console.warn('Fotos nicht exportiert', e); o.photosError = String(e.message||e); } }
  return o;
}
async function restorePhotos(list){
  if (!Array.isArray(list) || !list.length) return 0; let have = new Set(); try { have = new Set((await PDB.all()).map(m => m.id)); } catch(e){}
  let n = 0; for (const p of list){ try { if (!p || !p.meta || !p.meta.id || have.has(p.meta.id)) continue;
    const meta = {...p.meta, thumb: await dataToBlob(p.meta.thumb)}; await PDB.add(meta, await dataToBlob(p.full)); n++; } catch(e){ console.warn('Foto-Import', e); } }
  return n;
}
function importText(txt, opts={}){
  try { let o = typeof txt === 'string' ? JSON.parse(txt) : txt; let photos = null;
    if (o && o.type === 'das-system-backup'){ photos = o.photos; o = o.save; }
    if (!o || typeof o !== 'object' || !o.base || !o.level) throw new Error('Kein gültiger Spielstand');
    const go = async () => { S = merge(newState(), o); migrateProof(S); rollover(); checkUnlocks(); save(); render();
      const n = await restorePhotos(photos); render();
      toast(`${opts.title||'Spielstand importiert.'}${n?` · ${n} Beweisfoto${n>1?'s':''} übernommen`:''}`, '[SYSTEM]', 4500); };
    const cur = (() => { try { return JSON.parse(localStorage.getItem(SAVE_KEY)||'null'); } catch(e){ return null; } })();
    const fresh = !cur || (cur.level <= 1 && !(cur.cnt && cur.cnt.quests));
    const info = `Spielstand von „${esc(o.name)}“ (Level ${o.level}${photos&&photos.length?`, ${photos.length} Beweisfoto${photos.length>1?'s':''}`:''}) laden?`;
    if (opts.noAsk && fresh) go(); else ask(`${info} Der aktuelle Stand wird überschrieben.`, go, 'Laden');
  } catch(e){ toast('Import fehlgeschlagen: '+esc(e.message),'[FEHLER]'); }
}
async function exportBackup(kind){

  toast(umzug ? 'Spielstand + Fotos werden gesichert …' : 'Backup wird erstellt …');
  const o = await buildBackup(true), txt = JSON.stringify(o), name = `das-system-${umzug?'umzug':'backup'}-${dayStr()}.json`;
  const pc = o.photos.length, mbv = txt.length/1048576, mb = mbv < .1 ? '< 0,1' : mbv.toFixed(1).replace('.', ','), pcs = `${pc} Beweisfoto${pc===1?'':'s'}`;

/* ---------- Umzug alte App (TWA/Browser) → neue native App, automatisch ---------- */
const b64u = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i+0x8000)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
const unb64u = t => { const s = atob(t.replace(/-/g,'+').replace(/_/g,'/') + '==='.slice((t.length+3)%4)); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; };
async function packSave(obj){
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  if (window.CompressionStream){ try { const z = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer()); return 'z' + b64u(z); } catch(e){} }
  return 'j' + b64u(raw);
}
async function unpackSave(d){
  const u = unb64u(d.slice(1));
  const raw = d[0] === 'z' ? new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer()) : u;
  return JSON.parse(new TextDecoder().decode(raw));
}

function penProofFields(p, day){

const EARCH = n => /wolf|ratte|hund|spinne/i.test(n) ? (/spinne/i.test(n)?'spider':'beast') : /geist|sukkubus/i.test(n) ? 'ghost' : /gargoyle|elementar/i.test(n) ? 'golem'

const ECOL = {E:'#7bd36a',D:'#c9874a',C:'#b9c6d6',B:'#3fc7a0',A:'#e0405a',S:'#ff8a2a',T:'#8aa0ff',X:'#ffcf4d'};

   beast:`<ellipse cx="50" cy="62" rx="32" ry="17" fill="${c}"/><path d="M70 50l18-14 2 24z" fill="${c}"/><path d="M76 40l4-12 6 10z" fill="${c}"/><circle cx="82" cy="48" r="2.6" fill="${eye}"/><path d="M18 60l-14-8 6 14z" fill="${c}"/><rect x="26" y="72" width="7" height="16" rx="3" fill="${c}"/><rect x="62" y="72" width="7" height="16" rx="3" fill="${c}"/><path d="M84 58l6 2-6 3z" fill="#fff"/>`,

   ghost:`<path d="M24 86V44a26 26 0 0152 0v42l-9-8-8 8-9-8-9 8-8-8z" fill="${c}" opacity=".85"/><circle cx="41" cy="44" r="5" fill="${d}"/><circle cx="59" cy="44" r="5" fill="${d}"/><circle cx="41" cy="44" r="2" fill="${eye}"/><circle cx="59" cy="44" r="2" fill="${eye}"/>`,
   golem:`<rect x="26" y="30" width="48" height="46" rx="6" fill="${c}"/><rect x="36" y="14" width="28" height="20" rx="4" fill="${c}"/><rect x="10" y="36" width="14" height="34" rx="5" fill="${c}"/><rect x="76" y="36" width="14" height="34" rx="5" fill="${c}"/><rect x="30" y="76" width="14" height="16" fill="${c}"/><rect x="56" y="76" width="14" height="16" fill="${c}"/><rect x="42" y="21" width="5" height="4" fill="${eye}"/><rect x="53" y="21" width="5" height="4" fill="${eye}"/><path d="M34 44l10 8M60 40l6 12" stroke="${d}" stroke-width="2"/>`,
   dragon:`<path d="M20 70q30-50 60-30l12-10-4 18q6 14-8 24z" fill="${c}"/><path d="M40 52L10 20l36 18z" fill="${c}" opacity=".8"/><path d="M58 46l20-34 0 30z" fill="${c}" opacity=".8"/><circle cx="82" cy="40" r="3" fill="${eye}"/><path d="M20 70q-12 10-16 20 14-6 26-14" fill="${c}"/><path d="M90 44l8 4-8 2z" fill="#ff9a3a" class="orb"/>`,

function enemyBox(e, b){
  const cls = ['emon', e.boss?'boss':'', e.rage?'rage':'', b.anim?.hit?'hitfx':'', b.anim?.lunge?'lunge':'', e.hp<=0?'dead':'', b.tele?'tele':''].join(' ');
  return `<div class="${cls}" id="enemy" data-arch="${e.arch||EARCH(e.n)}">${enemySVG(e)}</div>`;
}

/* ---------- Kampf-Kern (Gates, Turm, Arena, Rote Gates) ---------- */
function mkEnemy(n, i, hp, atk, o={}){ return {n, i, hp, max:hp, atk, trait: o.trait ?? ETRAIT[n] ?? null, boss:!!o.boss, col:o.col, arch:o.arch, turn:0}; }
function startFight(o){
  const d = derived(), c = CB();
  const party = c.party.filter(id => S.shadows[id]).slice(0,3).map(id => ({id, n: GATES.find(g=>g.shadow.id===id).shadow.n, i: GATES.find(g=>g.shadow.id===id).shadow.i, cls: shCls(id), pow: shPow(id)}));
  UI.battle = {mode:o.mode||'gate', g:o.g||null, title:o.title, list:o.list, idx:0, enemy:{...o.list[0]}, php:d.hp, pmax:d.hp, mp:d.mp, mpmax:d.mp,
    freePot:1+(d.B.potion||0), log:[o.intro], over:null, auto:false, party, cds:{}, combo:[], buffs:{}, poison:0, guard:0, wave:1, loot:o.loot||1,
    noFlee:!!o.noFlee, deadline:o.time?Date.now()+o.time:0, round:0, used:{}};
  if (party.length) bLog(`👥 Schatten-Gruppe: ${party.map(p=>p.i+' '+p.n).join(', ')}`);
  try { baseFightHook(UI.battle); } catch(x){ console.error(x); }
  if (c.charges.length) bLog(`⚡ ${c.charges.length} Kampfenergie bereit – Power-Schlag verfügbar!`);
}
function startBattle(g, red){
  const k = red ? 1.3 : 1;
  const list = [...g.mobs.map(m=>mkEnemy(m[0],m[1],Math.round(m[2]*k),Math.round(m[3]*k),{col:red?'#ff3050':ECOL[g.rank]})), mkEnemy(g.boss[0],g.boss[1],Math.round(g.boss[2]*k),Math.round(g.boss[3]*k),{boss:true,col:red?'#ff1a3a':ECOL[g.rank]})];
  startFight({mode:red?'red':'gate', g, list, title: red?`🟥 ROTES GATE · ${g.name}`:`${g.rank}-Gate · ${g.name}`, noFlee:!!red, time:red?RG_TIME:0, loot:red?2:1,
    intro: red?`[SYSTEM] ⚠ Du hast ein ROTES GATE betreten. Der Ausgang ist versiegelt. Besiege alle Gegner in 8 Minuten!`:`[SYSTEM] Du hast das ${g.rank}-Gate „${g.name}“ betreten.`});
}
function towerGuard(f){ const boss = f%5===0, pool = ['Turmwächter','Steingolem','Runenritter','Spiegelgeist','Turmdrache'], n = boss?`Etagenherr ${f}`:pool[f%pool.length]+' '+f;
  const hp = Math.round(60 + f*38 + (boss?f*30:0)), atk = Math.round(6 + f*2.4 + (boss?f:0));
  return mkEnemy(n, '🛡️', hp, atk, {boss, col:boss?'#ffcf4d':'#8aa0ff', trait: boss?null:['armor',null,'evade','heal',null][f%5], arch: boss?'golem':['golem','brute','ghost','caster','dragon'][f%5]}); }
function arenaFoe(w){ const pool = GATES.flatMap(g=>g.mobs.map(m=>[...m,g.rank])); const m = pool[(w*7)%pool.length], boss = w%5===0, s = Math.pow(1.18, w-1);
  return mkEnemy(boss?`Arena-Champion ${w}`:m[0], m[1], Math.round((50 + w*12)*s*(boss?2.2:1)), Math.round((7 + w*1.6)*Math.pow(1.08,w-1)*(boss?1.3:1)), {boss, col:boss?'#ffcf4d':ECOL[m[4]], arch: boss?'brute':undefined}); }
const weekKey = () => { const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+3-(d.getDay()+6)%7); const w1 = new Date(d.getFullYear(),0,4); return d.getFullYear()+'-W'+(1+Math.round(((d-w1)/864e5-3+(w1.getDay()+6)%7)/7)); };
function bLog(t){ UI.battle.log.unshift(t); }
function dmgMul(b){ return (b.buffs.qi>0?1.4:1) * (b.buffs.buff>0?1.5:1); }
function hitEnemy(b, base, o={}){
  const e = b.enemy, d = derived(); let dmg = base * rnd(.85,1.15) * dmgMul(b); let crit = o.crit || Math.random()*100 < d.crit;
  if (crit) dmg *= 1.8;
  if (!o.magic && !o.pierce && e.trait==='evade' && Math.random() < .3){ bLog(`💨 ${e.n} weicht aus!`); b.anim = {txt:'MISS'}; return 0; }
  if (!o.magic && !o.pierce && e.trait==='armor'){ dmg *= .25; if (!b.armorHint){ b.armorHint = 1; bLog('🛡 Gepanzert! Physische Angriffe prallen ab – nutze Mana-Klinge oder Magie.'); } }
  dmg = Math.max(1, Math.round(dmg)); e.hp -= dmg; b.anim = {hit:true, txt:(crit?'KRIT! ':'')+dmg}; return dmg;
}
function telegraphOpen(b){ const t = b.tele; if (!t) return null; const dt = Date.now() - t.t0; return {block: dt>=600 && dt<=2600, dodge: dt>=1000 && dt<=2000, dt}; }
function playerAct(kind){
  const b = UI.battle; if (!b || b.over) return; const d = derived(), e = b.enemy, c = CB();
  if (b.deadline && Date.now() > b.deadline){ return fightLose('⌛ Die Zeit ist abgelaufen. Das Rote Gate hat dich verschlungen.'); }
  b.round++; let defend = null;
  const comboPush = k => { b.combo.push(k); if (b.combo.length>3) b.combo.shift(); };
  if (kind==='pot'){
    if (b.freePot>0){ b.freePot--; heal(.4); } else if (S.inv.hp_s>0){ S.inv.hp_s--; heal(.4); } else if (S.inv.hp_l>0){ S.inv.hp_l--; heal(1); } else return;
    b.combo = [];
  } else if (kind==='block' || kind==='dodge'){ defend = kind; b.combo = [];
    if (!b.tele){ if (kind==='block'){ b.guard = Math.max(b.guard, .5); bLog('🛡 Du gehst in Deckung.'); } else bLog('💨 Du bereitest dich aufs Ausweichen vor.'); }
  } else if (kind==='skill' && b.mp < 15){
    if (!(S.inv.mp_s>0)) return; S.inv.mp_s--; b.mp = Math.min(b.mpmax, b.mp + Math.round(b.mpmax*.6)); bLog('🫙 Manatrank getrunken.'); b.combo = [];
  } else if (kind==='atk' || kind==='skill'){
    const fin = kind==='skill' && b.combo.length>=2 && b.combo.slice(-2).every(x=>x==='atk');
    if (kind==='skill') b.mp -= 15;
    const reps = b.buffs.clone>0 ? 2 : 1; let tot = 0;
    for (let r=0;r<reps && e.hp>0;r++) tot += hitEnemy(b, kind==='skill' ? d.skill*(fin?2.5:1) : d.atk, {magic:kind==='skill'});
    if (fin){ b.combo = []; S.cnt.combos = (S.cnt.combos||0)+1; b.anim = {...b.anim, txt:'COMBO! '+tot}; bLog(`🌀 COMBO-FINISHER! Angriff → Angriff → Mana-Klinge: ${tot} Schaden`); }
    else { comboPush(kind); bLog(`${kind==='skill'?'✨ Mana-Klinge':'⚔️ Angriff'}: ${tot} Schaden${reps>1?' (Doppel)':''}`); }
  } else if (kind==='shadow'){
    if (!b.party.length || (b.cds.shadow||0)>0) return; b.cds.shadow = 3; b.combo = [];
    let tot = 0; for (const p of b.party) tot += hitEnemy(b, p.pow*2, {pierce:p.cls==='Magier'});
    b.anim = {hit:true, txt:'SCHATTEN! '+tot}; bLog(`🟣 Schatten-Angriff! Deine Armee stürmt vor: ${tot} Schaden`);
  } else if (kind==='power'){
    if (!c.charges.length) return; c.charges.shift(); b.combo = [];
    const dmg = hitEnemy(b, d.atk*3 + d.skill, {pierce:true}); b.anim = {hit:true, txt:'POWER! '+dmg}; bLog(`⚡ POWER-SCHLAG (Trainingsenergie): ${dmg} Schaden`);
  } else if (kind.startsWith('sk:')){
    const s = SSK.find(x=>'sk:'+x.id===kind); if (!s || !sysOn(s.sys) || (b.cds[s.id]||0)>0 || b.mp < s.mp || (s.id==='ult' && b.used.ult)) return;
    b.mp -= s.mp; b.cds[s.id] = s.cd; b.combo = [];
    if (s.id==='fire') bLog(`🔥 Feuerball: ${hitEnemy(b, d.skill*1.8, {magic:true})} Schaden`);
    if (s.id==='clone'){ b.buffs.clone = 3; bLog('👥 Schattendoppel! 3 Runden doppelte Angriffe.'); }
    if (s.id==='ult'){ b.used.ult = 1; const x = hitEnemy(b, d.atk*4, {pierce:true}); b.anim = {hit:true, txt:'ULTIMATE! '+x}; bLog(`💥 HELDEN-ULTIMATE: ${x} Schaden`); }
    if (s.id==='qi'){ b.buffs.qi = 3; heal(.15); bLog('☯️ Qi-Fokus: +40 % Schaden für 3 Runden.'); }
    if (s.id==='gcrit'){ let x = 0; for (let i=0;i<2;i++) x += hitEnemy(b, d.atk, {crit:true}); bLog(`🎮 Doppelschlag: ${x} Schaden (2 Krits)`); }
    if (s.id==='regen'){ heal(.3); b.poison = 0; bLog('🧬 Regeneration: Gift entfernt.'); }
  } else if (BATTLE_ONLY.includes(kind)){
    if (!(S.inv[kind]>0)) return;
    if (kind==='escape'){ if (b.noFlee){ bLog('🟥 Das Rote Gate ist versiegelt – Fluchtrolle wirkungslos!'); return; } S.inv.escape--; S.keys += (b.mode==='gate'?1:0); stopAuto(); UI.battle = null; log('Mit Fluchtrolle entkommen'); toast('📜 Fluchtrolle: Du bist entkommen. Der Schlüssel bleibt erhalten.','[SYSTEM]'); save(); return; }
    S.inv[kind]--; b.combo = [];
    if (kind==='bomb'){ const x = Math.max(1, Math.round(e.max*(e.boss?.1:.25))); e.hp -= x; b.anim = {hit:true, txt:'💣 '+x}; bLog(`💣 Bombe: ${x} Schaden`); }
    if (kind==='buff'){ b.buffs.buff = 3; bLog('💪 Krafttrank: +50 % Schaden für 3 Runden.'); }
    if (kind==='anti'){ b.poison = 0; heal(.1); bLog('🌿 Gegengift: Vergiftung geheilt.'); }
  } else return;
  // Schatten handeln jede Runde
  if (e.hp > 0 && kind!=='shadow') for (const p of b.party){
    if (p.cls==='Tank'){ b.guard = Math.max(b.guard, .35); if (b.round%2) hitEnemy(b, p.pow*.5, {}); }
    else { const x = hitEnemy(b, p.pow*(p.cls==='Magier'?1.1:1), {pierce:p.cls==='Magier', crit:p.cls==='Assassine' && Math.random()<.35}); if (x) bLog(`${p.i} ${p.n} (${p.cls}): ${x}`); }
    if (e.hp <= 0) break; }
  if (b.party.some(p=>p.cls==='Tank') && e.hp>0 && b.round===1) bLog('🛡 Dein Tank-Schatten schützt dich (−35 % Schaden).');
  if (e.hp <= 0){ b.tele = null; b.dead = {...e}; bLog(`💥 ${e.n} besiegt!`); try { dropFor(e, b); } catch(x){ console.error(x); } tickCds(b); return nextEnemy(); }
  // Gegnerzug
  enemyTurn(b, d, defend); tickCds(b);
  if (b.php <= 0) fightLose();
  function heal(p){ const h = Math.round(b.pmax*p); b.php = Math.min(b.pmax, b.php+h); bLog(`🧪 Heilung: +${h} HP`); }
}
function tickCds(b){ for (const k in b.cds) if (b.cds[k]>0) b.cds[k]--; for (const k in b.buffs) if (b.buffs[k]>0) b.buffs[k]--; }
function enemyTurn(b, d, defend){
  const e = b.enemy; e.turn++;
  if (b.poison > 0){ const p = Math.max(1, Math.round(b.pmax*.06)); b.php -= p; b.poison--; bLog(`☠ Gift: −${p} HP`); }
  if (e.boss && !e.rage && e.hp < e.max*.5){ e.rage = true; e.atk = Math.round(e.atk*1.4); bLog(`🔴 ${e.n} gerät in WUT-MODUS! Mehr Schaden, schnellere Spezialangriffe.`); vibrate([100,50,100]); }
  const red = (x) => Math.max(1, Math.round(x * (1 - b.guard))); 
  if (b.tele){ // angekündigter Spezialangriff landet
    const t = b.tele, w = telegraphOpen(b); b.tele = null; let hit = Math.round(t.dmg);
    if (defend==='dodge' && w.dodge){ bLog(`💨 PERFEKT AUSGEWICHEN! ${t.n} verfehlt dich.`); b.anim = {...b.anim, txt:'AUSGEWICHEN'}; S.cnt.dodges=(S.cnt.dodges||0)+1; hit = 0; }
    else if (defend==='block' && w.block){ hit = Math.round(hit*.25); bLog(`🛡 GEBLOCKT! ${t.n} trifft nur mit ${hit}.`); S.cnt.blocks=(S.cnt.blocks||0)+1; }
    else { bLog(`💢 ${defend?'Zu '+(w.dt<600?'früh':'spät')+'! ':''}${t.n} trifft voll: ${hit}`); b.anim = {...b.anim, lunge:true}; vibrate(200); }
    b.php -= hit; b.guard = 0; return; }
  if (e.trait==='heal' && e.turn%3===0 && e.hp < e.max){ const h = Math.round(e.max*.15); e.hp = Math.min(e.max, e.hp+h); bLog(`✚ ${e.n} heilt sich um ${h}.`); b.guard = 0; return; }
  if (e.boss && e.turn % (e.rage?2:3) === 0){ b.tele = {t0: Date.now(), dmg: e.atk*2.6, n: e.rage?'Zorn-Schlag':'Vernichtungsschlag'};
    bLog(`⚠ ${e.n} LÄDT AUF … ${b.tele.n}! Gleich 🛡 Blocken oder 💨 Ausweichen – auf „JETZT!“ tippen.`); vibrate([60,40,60]); teleTimers(); b.guard = 0; return; }
  if (Math.random()*100 < d.dodge && defend!=='block'){ bLog(`💨 Du weichst ${e.n} aus!`); b.guard = 0; return; }
  const hit = red(e.atk*rnd(.85,1.2) - d.def) * (defend==='block'?.5:1); b.php -= Math.round(hit); b.anim = {...b.anim, lunge:true}; bLog(`🩸 ${e.n} trifft dich: ${Math.round(hit)}`);
  if (e.trait==='poison' && Math.random() < .4 && !b.poison && !baseFx().antipoison){ b.poison = 3; bLog('☠ Du wurdest vergiftet! (3 Runden)'); }
  b.guard = 0;
}
function teleTimers(){ [650, 1050, 2050, 2650].forEach(ms => setTimeout(() => { if (UI.tab==='gates' || UI.battle?.mode==='tower') render(); }, ms)); }
function fightLose(msg){ const b = UI.battle; b.over = 'lose'; b.loseMsg = msg || ''; stopAuto(); vibrate(300);
  if (b.mode==='arena') arenaEnd(b);
  log(b.mode==='tower'?`Turm: Niederlage auf Etage ${S.m.tower.floor+1}`:b.mode==='arena'?`Arena beendet bei Welle ${b.wave}`:`Niederlage im ${b.g?.rank}-Gate`); }
function arenaEnd(b){ const a = CB().arena, w = b.wave - 1, wk = weekKey(); if (a.week !== wk){ a.week = wk; a.wbest = 0; }
  const rec = w > a.best; a.best = Math.max(a.best, w); a.wbest = Math.max(a.wbest, w); a.runs++;
  const gold = w*15, xp = gainXP(w*10); S.gold += gold; b.reward = `Erreichte Welle: <b>${w}</b>${rec?' · 🏆 NEUER REKORD!':''}<br>+${xp} XP · +${gold} 🪙<br>Bestwert: ${a.best} · Diese Woche: ${a.wbest}`; }
function nextEnemy(){
  const b = UI.battle;
  if (b.mode==='arena'){ b.wave++; b.enemy = arenaFoe(b.wave); b.php = Math.min(b.pmax, b.php + Math.round(b.pmax*.15)); b.mp = Math.min(b.mpmax, b.mp + 10);
    bLog(`🏟 Welle ${b.wave}: ${b.enemy.n} betritt die Arena! (+15 % HP)`); return; }
  b.idx++;
  if (b.idx < b.list.length){ b.enemy = {...b.list[b.idx]}; bLog(b.enemy.boss?`⚠ Der Boss erscheint: ${b.enemy.n}!`:`Ein ${b.enemy.n} taucht auf.`); if (b.enemy.trait) bLog(TRAITN[b.enemy.trait]); return; }
  stopAuto(); b.over = 'win';
  if (b.mode==='tower'){ const f = S.m.tower.floor; S.m.tower.floor++; const g = 20*(f+1); S.gold += g; let t = `+${g} 🪙`; if ((f+1)%10===0){ S.cry++; t += ' · +1 💎'; } const xp = gainXP(10+f*2);
    b.reward = `Etage ${f+1} erobert! +${xp} XP · ${t}`; log(`Turm: Etage ${f+1} erobert`); checkUnlocks(); return; }
  const g = b.g, L = b.loot;
  const xp = gainXP(g.xp*L); const gold = Math.round(g.gold*L*(1+(bonuses().res||0)/100)); S.gold += gold;

function addMat(k, n){ const v = ST(), free = storeCap() - matTotal(); const g = Math.max(0, Math.min(n, free)); if (g) v.mats[k] = (v.mats[k]||0) + g; if (!v.found.includes(k)) v.found.push(k); return g; }
function dropFor(e, b){
  const a = e.arch || EARCH(e.n), tab = [...(DROPS[a]||DROPS.brute), ...(NAMEDROP[e.n]||[]), ['wood',.35,1], [START().mat,.3,1]];
  const loot = (b.loot||1) * (1 + (bonuses().loot||0)*.1); const got = [];
  for (const [k, ch, n] of tab){ if (Math.random() < Math.min(1, ch*(e.boss?1.6:1))){ const q = Math.max(1, Math.round(n*loot*(e.boss?2:1))); const g = addMat(k, q); got.push([k, g, q]); } }
  if (e.boss){ got.push(['troph', addMat('troph', b.loot||1), b.loot||1]); }
  b.drops = b.drops || []; for (const d of got) b.drops.push(d);
  if (got.length) bLog(`🎁 Beute: ${got.map(([k,g,q])=>`<span style="color:${RAR[MAT2[k].r].col}">${q}× ${MAT2[k].i} ${MAT2[k].n}</span>${g<q?' (Lager voll)':''}`).join(', ')}`);
}

function applyStart(){
  const st = START();

function chooseStart(id){
  const v = ST(); v.start = id; v.asked = true; applyStart();
  S.quests.filter(q=>q.sys==='solo'&&!q.dq).forEach(q => { const o = ORIG_QN.find(n => q.name===n || q.name.startsWith(n+' · ')); if (o){ const st = STARTS[id]; q.name = st.qs[o] ? `${o} · ${st.qs[o]}` : o; } });
  const f = STARTS[id].unlockFirst;
  if (f && !S.sys.unlocked.includes(f)){ const s = SYS[f]; S.sys.unlocked.push(f); S.sys.active.push(f); s.quests.forEach(q=>S.quests.push(mkQuest(q,f))); log(`Start-System-Bonus: ${s.name}`); }

  log(`Start-System gewählt: ${STARTS[id].n}`);
}

  return r; })(addRes);
render = (orig => function(){ adVariantApply(); return orig.apply(this, arguments); })(render);

SYS.adult.flavor.all = 'Tag voller Selbstliebe & Lust abgeschlossen. Du strahlst.';

/* --- Start-System „Erwachsenen“ (neutral auf der Karte; Inhalte erst nach 18+-Häkchen) --- */
STARTS.adult = {n:'Erwachsenen-System',i:'🔞',tag:'[18+]',base:'Wohlfühl-Raum',bi:'💗',mat:'mana',

baseScene = (orig => function(){

function finishAdultStart(fromRandom){
  const a = AD();

  S.quests = S.quests.filter(q => q.sys !== 'adult');
  AQ.forEach(q => S.quests.push(mkQuest(q, 'adult')));

  if (a.bdsm) AQ_BDSM.forEach(q => S.quests.push({...mkQuest(q,'adult'), bdsm:true}));

  applyStart(); save();
  UI.tab = 'systems'; UI.detail = 'adult'; render();

}

})(A.pickStart);

    adStartGateModal('random');

  A.pickStart({id});

};

};

window.SYS7O = {AQ_BDSM, AQ_BDSM_COUPLE, DQ_BDSM, finishAdultStart, adStartGateModal};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;

  try { fn({...el.dataset}, el); } catch(err){ console.error(err); toast('Fehler: '+esc(err.message),'[FEHLER]'); }

});
$('#modal').addEventListener('click', e => { if (e.target.id==='modal') closeModal(); });
function showPenaltyIntro(){
  if (S.penaltyLoss){ toast(`Die Strafquest wurde nicht erfüllt: −${S.penaltyLoss} XP`,'[SYSTEM]',5000); S.penaltyLoss=0; }

}
